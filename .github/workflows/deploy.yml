name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve source repo + sparse-checkout paths
        id: manifest
        run: |
          set -euo pipefail
          # Extract repo coords + the union of every benchmark `source` from
          # content/manifest.json. Writes the path list to ./.sparse-paths and
          # exposes the repo coords via step outputs.
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync('content/manifest.json', 'utf8'));
          const paths = new Set();
          for (const b of m.benchmarks) if (b.source) paths.add(b.source);
          writeFileSync('.sparse-paths', [...paths].join('\n') + '\n');
          const out = process.env.GITHUB_OUTPUT;
          appendFileSync(out, `owner=${m.sourceRepo.owner}\n`);
          appendFileSync(out, `repo=${m.sourceRepo.repo}\n`);
          appendFileSync(out, `branch=${m.sourceRepo.branch ?? 'master'}\n`);
          EOF
          echo "Sparse-checkout paths:"
          cat .sparse-paths
        shell: bash

      - name: Sparse-checkout factorio-benchmarks
        run: |
          set -euo pipefail
          OWNER='${{ steps.manifest.outputs.owner }}'
          REPO='${{ steps.manifest.outputs.repo }}'
          BRANCH='${{ steps.manifest.outputs.branch }}'
          DEST="${RUNNER_TEMP}/${REPO}"
          # blob:limit=1k: fetch every git-lfs pointer up front for the /saves index.
          git clone --depth 1 --filter=blob:limit=1k --sparse \
            --branch "${BRANCH}" \
            "https://github.com/${OWNER}/${REPO}.git" "${DEST}"
          mapfile -t SPARSE_PATHS < .sparse-paths
          (cd "${DEST}" && git sparse-checkout set -- "${SPARSE_PATHS[@]}")
          (cd "${DEST}" && git lfs pull --include="*.csv")
          echo "FACTORIO_BENCHMARKS_PATH=${DEST}" >> "$GITHUB_ENV"
        shell: bash

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test Worker
        run: npm test

      - name: Deploy to Cloudflare
        # The Worker's secrets ride along with the deploy (--secrets-file), written to a
        # private temp file from repository secrets. A secret that is empty here is left
        # out, so the Worker keeps the value it already has; wrangler.jsonc's
        # `secrets.required` makes the deploy fail if it has none.
        run: |
          set -euo pipefail
          SECRETS_FILE="${RUNNER_TEMP}/worker-secrets.json"
          trap 'rm -f "${SECRETS_FILE}"' EXIT
          (umask 077 && node -e '
            const out = {};
            if (process.env.YOUTUBE_API_KEY) out.YOUTUBE_API_KEY = process.env.YOUTUBE_API_KEY;
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(out));
          ' "${SECRETS_FILE}")
          npx wrangler deploy --secrets-file "${SECRETS_FILE}"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
